<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Grid</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    h1 {
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 1rem;
      margin-top: 20px;
    }

    article {
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      transition: 0.3s;
      text-align: center;
      background-color: #fff;
    }

    article:hover {
      background-color: #f5f5f5; 
      border-width: 2px;
    }

    .img {
      height: 150px;
      background-color: #ddd;
      margin-bottom: 10px;
      border-radius: 5px;
    }

    .price {
      color: green;
      font-weight: bold;
      display: block;
      margin: 10px 0;
    }

    button {
      padding: 10px 15px;
      background-color: black;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #333;
    }
  </style>
</head>
<body>

  <h1>Shop Products</h1>

  <section class="grid">
    
    <article>
      <div class="img"></div>
      <h3>Product 1</h3>
      <span class="price">$19.99</span>
      <button>Buy Now</button>
    </article>

    <article>
      <div class="img"></div>
      <h3>Product 2</h3>
      <span class="price">$19.99</span>
      <button>Buy Now</button>
    </article>

    <article>
      <div class="img"></div>
      <h3>Product 3</h3>
      <span class="price">$19.99</span>
      <button>Buy Now</button>
    </article>

    <article>
      <div class="img"></div>
      <h3>Product 4</h3>
      <span class="price">$19.99</span>
      <button>Buy Now</button>
    </article>

  </section>

</body>
</html>
